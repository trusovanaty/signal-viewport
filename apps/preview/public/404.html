      :root {
        --ink: #17151a;
        --paper: #fff;
        --muted: #4d4d4d;
        --accent: #e52600;
        --sans: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 600; }
      body { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; padding: 16px clamp(16px, 3.4vw, 48px) clamp(24px, 4vw, 48px); }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .label { display: flex; align-items: center; gap: 12px; margin: 0; font: 500 13px/1.5 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
      .label::before { content: ''; width: 10px; height: 10px; background: var(--accent); }
      .lang { display: flex; }
      .lang button { min-width: 44px; min-height: 44px; padding: 0 10px; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); font: 500 13px/1 var(--mono); letter-spacing: 0.04em; cursor: pointer; }
      .lang button + button { margin-left: -2px; }
      .lang button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
      main { align-self: center; padding-block: clamp(16px, 4vh, 40px); }
      h1 { margin: 0 0 0 -0.04em; font-size: min(31vw, 40dvh); font-weight: 600; line-height: 0.8; letter-spacing: -0.045em; white-space: nowrap; }
      h1 .dot { display: inline-block; width: 0.26em; height: 0.2em; margin-left: 0.06em; background: var(--accent); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
      /* The ruler of the player, with the pin far past the last tick: this moment is not on it. */
      .ruler { position: relative; height: 22px; margin-top: clamp(16px, 3vh, 32px); }
      .ruler::before { content: ''; position: absolute; inset: 14px 0 auto; height: 1px; background: var(--ink); }
      .ticks { position: absolute; inset: 3px auto auto 0; width: 56%; height: 11px; background-image: linear-gradient(to right, var(--ink) 1px, transparent 1px), linear-gradient(to right, var(--ink) 1px, transparent 1px); background-position: 0 100%, 0 100%; background-size: 16px 5px, 80px 11px; background-repeat: repeat-x; }
      .pin { position: absolute; left: 78%; top: 0; width: 14px; height: 22px; margin-left: -7px; }
      .pin::before { content: ''; position: absolute; left: 0; top: 0; border-inline: 7px solid transparent; border-top: 9px solid var(--accent); }
      .pin::after { content: ''; position: absolute; left: 6px; top: 9px; width: 2px; height: 13px; background: var(--accent); }
      .chip { position: absolute; left: 78%; top: 26px; transform: translateX(-50%); padding: 2px 8px; background: var(--ink); color: var(--paper); font: 500 13px/1.5 var(--mono); letter-spacing: 0.04em; }
      .text { display: grid; gap: 12px; justify-items: start; margin-top: clamp(36px, 6vh, 56px); max-width: 34em; }
      .lead { margin: 0; font-size: clamp(28px, 2.6vw, 36px); line-height: 1.02; letter-spacing: -0.02em; }
      .desc { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.5; }
      .btn { display: inline-flex; align-items: center; min-height: 44px; margin-top: 4px; padding: 0 20px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font: 600 15px/1 var(--sans); text-decoration: none; }
      .btn:hover { background: var(--paper); color: var(--ink); }
      a:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      .btn:focus-visible { outline-color: var(--ink); }
      @media (max-width: 719.98px) {
        h1 { font-size: 40vw; }
        .ticks { background-size: 12px 5px, 60px 11px; }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <p class="label" id="kicker">Signal Viewport</p>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
        <button type="button" data-lang="uk" aria-pressed="false" lang="uk">UK</button>
      </div>
    </div>
    <main>
      <h1><span aria-hidden="true">404<span class="dot"></span></span><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)" id="h1-text">Page not found</span></h1>
      <div class="ruler" aria-hidden="true"><span class="ticks"></span><span class="pin"></span><span class="chip">4:04</span></div>
      <div class="text">
        <p class="lead" id="lead">This moment<br />is not on the ruler.</p>
        <p class="desc" id="desc">The page you asked for does not exist, or it has moved.</p>
        <a class="btn" id="back" href="/">Back to the player</a>
      </div>
    </main>
    <script>
      var T = {
        en: { title: '404 · Signal Viewport', h1: 'Page not found', lead: 'This moment<br />is not on the ruler.', desc: 'The page you asked for does not exist, or it has moved.', back: 'Back to the player' },
        uk: { title: '404 · Signal Viewport', h1: 'Сторінку не знайдено', lead: 'Цієї миті<br />немає на лінійці.', desc: 'Такої сторінки немає, або її перенесли.', back: 'Назад до плеєра' },
      };
      function apply(l) {
        var t = T[l] || T.en;
        document.documentElement.lang = l;
        document.title = t.title;
        document.getElementById('h1-text').textContent = t.h1;
        document.getElementById('lead').innerHTML = t.lead;
        document.getElementById('desc').textContent = t.desc;
        document.getElementById('back').textContent = t.back;
        var b = document.querySelectorAll('.lang button');
        for (var i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', b[i].getAttribute('data-lang') === l ? 'true' : 'false');
        document.getElementById('back').setAttribute('href', l === 'uk' ? '/?lang=uk' : '/');
      }
      var buttons = document.querySelectorAll('.lang button');
      for (var i = 0; i < buttons.length; i++) buttons[i].addEventListener('click', function (e) { apply(e.currentTarget.getAttribute('data-lang')); });
      apply((navigator.language || 'en').toLowerCase().indexOf('uk') === 0 ? 'uk' : 'en');
    </script>
  </body>
</html>
